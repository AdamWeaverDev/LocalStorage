name: Build & Test Main

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
    NETCORE_VERSION: |
      10.0.x
      11.0.x
    OUTPUT_DIR: 'net10.0'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    PROJECT_NAME: LocalStorage
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    NUGET_FEED: https://api.nuget.org/v3/index.json
    NUGET_KEY: ${{ secrets.NUGET_KEY }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [ net10.0, net11.0 ]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core ${{ env.NETCORE_VERSION }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.NETCORE_VERSION }}
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Restore
      run: dotnet restore

    - name: Build Local Storage
      run: dotnet build -c Release --no-restore src/Blazored.$PROJECT_NAME/Blazored.$PROJECT_NAME.csproj
      
    - name: Build Local Storage Test Extensions
      run: dotnet build -c Release --no-restore src/Blazored.$PROJECT_NAME.TestExtensions/Blazored.$PROJECT_NAME.TestExtensions.csproj
      
    - name: Test Local Storage
      run: dotnet test -c Release --no-restore -f ${{ matrix.framework }} --verbosity normal tests/Blazored.$PROJECT_NAME.Tests

    - name: Test bUnit example
      run: dotnet test -c Release --no-restore -f ${{ matrix.framework }} --verbosity normal samples/bUnitExample

  deploy:
    # Disabled until there are new package IDs and a NuGet API key (NUGET_KEY).
    # Remove 'if: false' (and restore the release condition) to re-enable.
    needs: build
    if: false # was: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
      
      - name: Create Release NuGet package
        run: |
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          echo Version: $VERSION
          VERSION="${VERSION:1}"
          echo Clean Version: $VERSION
          dotnet pack -v normal -c Release --include-symbols --include-source -p:PackageVersion=$VERSION -o nupkg src/Blazored.$PROJECT_NAME/Blazored.$PROJECT_NAME.csproj
          dotnet pack -v normal -c Release --include-symbols --include-source -p:PackageVersion=$VERSION -o nupkg src/Blazored.$PROJECT_NAME.TestExtensions/Blazored.$PROJECT_NAME.TestExtensions.csproj
      
      - name: Push to NuGet Feed
        run: dotnet nuget push ./nupkg/*.nupkg --source $NUGET_FEED --api-key $NUGET_KEY --skip-duplicate
      
      - name: Publish Sample Site
        run: dotnet publish -c Release samples/BlazorWebAssembly/BlazorWebAssembly.csproj

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          html_path: samples/BlazorWebAssembly/bin/Release/$OUTPUT_DIR/publish/wwwroot/index.html
          base_href: /${{ env.PROJECT_NAME }}/

      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: samples/BlazorWebAssembly/bin/Release/$OUTPUT_DIR/publish/wwwroot # The folder the action should deploy.
          single-commit: true
